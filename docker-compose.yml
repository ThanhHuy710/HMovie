version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: hmovie_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vothanhhuy710
      POSTGRES_DB: HMovie
    ports:
      - "5432:5432"
    volumes:
      - ./HMovie/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./HMovie/HMovie.sql:/docker-entrypoint-initdb.d/02_HMovie.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hmovie-network

  redis:
    image: redis:7
    container_name: hmovie_redis
    ports:
      - "6379:6379"
    networks:
      - hmovie-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: hmovie_keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/Hmovie_keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: vothanhhuy710
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./HMovie/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8180:8080"
    depends_on:
      - postgres
    networks:
      - hmovie-network

volumes:
  postgres_data:

networks:
  hmovie-network:
    driver: bridge
